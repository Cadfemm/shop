databases:
  - name: my-shop-db
    plan: free
    region: singapore
    databaseName: myshop
    user: myshop

services:
  - type: web
    name: my-shop
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/items
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: my-shop-db
          property: connectionString
